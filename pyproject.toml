[project]
name = "auto-bot"
version = "0.1.0"
description = "Телеграм-бот: на /start и слова-триггеры кидает случайный мем и здоровается"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.31.0",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["bot*"]
